<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('登录')}"></head><body class="cf-app auth-page">
<svg th:replace="~{fragments/layout :: icons}"></svg>
<div class="auth-layout"><section class="auth-intro"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark"><svg th:replace="~{fragments/layout :: icon('coins')}"></svg></span><span>社团活动<span class="brand-sub">经费管理系统</span></span></a><div class="auth-message"><span class="auth-eyebrow">社团经费 · 清晰有序</span><h1>让每一笔经费<br>都有据可循。</h1><p>从活动申请到经费归档，<br>在一个工作空间里完成核对与协作。</p><div class="auth-stages"><span>01 活动申请</span><span>02 逐级审批</span><span>03 执行归档</span></div></div><p class="auth-intro-footer">社团活动经费管理系统</p></section>
<section class="auth-form-side"><div class="auth-form-card"><span class="auth-kicker">登录工作空间</span><h2>欢迎回来</h2><p class="auth-subtitle">登录后查看你的申请、审批与经费执行。</p><div th:replace="~{fragments/layout :: alerts}"></div><form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label" for="username">用户名</label><input type="text" class="form-control" id="username" name="username" autocomplete="username" required placeholder="请输入用户名"></div><div class="mb-4"><label class="form-label" for="password">密码</label><input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required placeholder="请输入密码"></div><button type="submit" class="button primary w-100">登录 <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button></form><p class="auth-switch">还没有账号？<a th:href="@{/register}">注册新账号</a></p><details class="demo-accounts"><summary>查看演示账号</summary><p>applicant1 / chairman1 / teacher1 / leader1 / admin1<br>演示密码：123456</p></details></div><p class="auth-bottom-note">社团活动经费管理系统</p></section></div><script th:src="@{/js/ui.js(v='b8c51d2db8f5')}" defer></script></body></html>
