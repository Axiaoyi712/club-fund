<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('注册')}"></head><body class="cf-app auth-page">
<svg th:replace="~{fragments/layout :: icons}"></svg>
<div class="auth-layout"><section class="auth-intro"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark"><svg th:replace="~{fragments/layout :: icon('coins')}"></svg></span><span>社团活动<span class="brand-sub">经费管理系统</span></span></a><div class="auth-message"><span class="auth-eyebrow">社团经费 · 清晰有序</span><h1>让每一笔经费<br>都有据可循。</h1><p>从活动申请到经费归档，<br>在一个工作空间里完成核对与协作。</p><div class="auth-stages"><span>01 活动申请</span><span>02 逐级审批</span><span>03 执行归档</span></div></div><p class="auth-intro-footer">社团活动经费管理系统</p></section>
<section class="auth-form-side"><div class="auth-form-card"><span class="auth-kicker">开始使用</span><h2>创建账号</h2><p class="auth-subtitle">新注册账号默认拥有申请人角色。</p><div th:replace="~{fragments/layout :: alerts}"></div><form th:action="@{/register}" method="post"><div class="mb-3"><label class="form-label" for="username">用户名</label><input type="text" class="form-control" id="username" name="username" th:value="${username}" maxlength="50" autocomplete="username" required placeholder="请输入用户名"></div><div class="mb-3"><label class="form-label" for="realName">真实姓名</label><input type="text" class="form-control" id="realName" name="realName" th:value="${realName}" maxlength="50" autocomplete="name" required placeholder="请输入真实姓名"></div><div class="mb-4"><label class="form-label" for="password">密码</label><input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="passwordHelp" required placeholder="请设置至少8个字符的密码"><div class="form-text" id="passwordHelp">至少8个字符，最多72字节（中文通常占3字节）。</div></div><button type="submit" class="button primary w-100">注册账号 <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button></form><p class="auth-switch">已有账号？<a th:href="@{/login}">返回登录</a></p></div><p class="auth-bottom-note">社团活动经费管理系统</p></section></div><script th:src="@{/js/ui.js(v='b8c51d2db8f5')}" defer></script></body></html>
