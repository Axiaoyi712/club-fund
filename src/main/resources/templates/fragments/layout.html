<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${title + ' - 社团活动经费管理系统'}"></title>
    <!-- 内容版本号让页面更新后自动绕过旧的静态资源缓存。 -->
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css(v='3c8f27e6009c')}">
    <link rel="stylesheet" th:href="@{/css/style.css(v='9a073c1f48be')}">
</head>
<body>
<svg th:fragment="icons" class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8.5 12l2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-3-5.2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M9 15v-4M14 15V7M19 15v-6"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1.5"/><path d="M5 8v12h14V8M10 12h4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M9 5H4v14h5M10 12h11M17 8l4 4-4 4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-coins" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 14h3M17 14h.01"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="m4 16 6-6 4 4 6-9M14 5h6v6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 4 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
<svg th:fragment="icon(name)" class="icon" aria-hidden="true"><use th:href="${'#i-' + name}"></use></svg>
<span th:fragment="role(role)" th:switch="${role}">
    <span th:case="'applicant'">申请人</span><span th:case="'chairman'">主席团</span>
    <span th:case="'teacher'">团委老师</span><span th:case="'leader'">学院领导</span>
    <span th:case="'admin'">管理员</span><span th:case="*">用户</span>
</span>
<aside th:fragment="sidebar(active)" class="sidebar" id="sidebar" aria-label="主导航">
    <a th:href="@{/index}" class="brand"><span class="brand-mark"><svg th:replace="~{fragments/layout :: icon('coins')}"></svg></span><span>社团活动<span class="brand-sub">经费管理系统</span></span></a>
    <button type="button" class="sidebar-close icon-button" aria-label="关闭导航"><svg th:replace="~{fragments/layout :: icon('close')}"></svg></button>
    <div class="nav-label">工作空间</div>
    <nav>
        <a class="nav-item" th:classappend="${active == 'index'} ? 'active'" th:attr="aria-current=${active == 'index' ? 'page' : null}" th:href="@{/index}"><svg th:replace="~{fragments/layout :: icon('grid')}"></svg>工作台</a>
        <a class="nav-item" th:classappend="${active == 'activity'} ? 'active'" th:attr="aria-current=${active == 'activity' ? 'page' : null}" th:href="@{/activity/list}"><svg th:replace="~{fragments/layout :: icon('file')}"></svg>活动申请</a>
        <a class="nav-item" th:if="${user.role == 'chairman' or user.role == 'teacher' or user.role == 'leader' or user.role == 'admin'}" th:classappend="${active == 'approve'} ? 'active'" th:attr="aria-current=${active == 'approve' ? 'page' : null}" th:href="@{/approve/list}"><svg th:replace="~{fragments/layout :: icon('check')}"></svg>经费审批</a>
        <a class="nav-item" th:classappend="${active == 'club'} ? 'active'" th:attr="aria-current=${active == 'club' ? 'page' : null}" th:href="@{/club/list}"><svg th:replace="~{fragments/layout :: icon('users')}"></svg>社团管理</a>
        <a class="nav-item" th:if="${user.role == 'admin'}" th:classappend="${active == 'report'} ? 'active'" th:attr="aria-current=${active == 'report' ? 'page' : null}" th:href="@{/report}"><svg th:replace="~{fragments/layout :: icon('chart')}"></svg>统计报表</a>
        <a class="nav-item" th:if="${user.role == 'teacher' or user.role == 'leader' or user.role == 'admin'}" th:classappend="${active == 'archive'} ? 'active'" th:attr="aria-current=${active == 'archive' ? 'page' : null}" th:href="@{/archive/list}"><svg th:replace="~{fragments/layout :: icon('archive')}"></svg>经费执行台账</a>
    </nav>
    <div class="nav-label messages-label">消息中心</div>
    <nav><a class="nav-item" th:classappend="${active == 'notification'} ? 'active'" th:attr="aria-current=${active == 'notification' ? 'page' : null}" th:href="@{/notification/list}"><svg th:replace="~{fragments/layout :: icon('bell')}"></svg>消息通知</a></nav>
    <div class="sidebar-bottom">
        <div class="semester"><span class="semester-dot"></span>经费申请 · 审批 · 执行</div>
        <div class="account"><span class="avatar" th:text="${#strings.isEmpty(user.realName) ? '用' : #strings.substring(user.realName, 0, 1)}"></span><span class="account-info"><span th:text="${user.realName}"></span><small><span th:replace="~{fragments/layout :: role(${user.role})}"></span></small></span><form class="mb-0 ms-auto" th:action="@{/logout}" method="post"><button class="exit-button icon-button" type="submit" aria-label="退出登录"><svg th:replace="~{fragments/layout :: icon('exit')}"></svg></button></form></div>
    </div>
</aside>
<header th:fragment="topbar(title)" class="topbar">
    <div class="breadcrumb"><button type="button" class="mobile-menu icon-button" aria-controls="sidebar" aria-expanded="false" aria-label="打开导航"><svg th:replace="~{fragments/layout :: icon('menu')}"></svg></button><span>工作空间</span><svg th:replace="~{fragments/layout :: icon('chevron')}"></svg><strong th:text="${title}"></strong></div>
    <div class="top-actions"><span class="topbar-role"><span th:replace="~{fragments/layout :: role(${user.role})}"></span></span><span class="top-divider"></span><a class="icon-button notification-button" th:href="@{/notification/list}" aria-label="消息通知"><svg th:replace="~{fragments/layout :: icon('bell')}"></svg><span class="notification-count" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount > 99 ? '99+' : unreadCount}"></span></a><span class="avatar avatar-small" th:text="${#strings.isEmpty(user.realName) ? '用' : #strings.substring(user.realName, 0, 1)}" th:attr="aria-label=${user.realName}"></span></div>
</header>
<footer th:fragment="footer" class="page-footer"><span>社团活动经费管理系统</span><span>申请 · 审批 · 执行 · 归档</span></footer>
<span th:fragment="status(value)" th:switch="${value}">
    <span th:case="'submitted'" class="status-pill pending"><i></i>待主席团审批</span>
    <span th:case="'chairman_passed'" class="status-pill processing"><i></i>待团委老师审批</span>
    <span th:case="'teacher_passed'" class="status-pill processing"><i></i>待学院领导审批</span>
    <span th:case="'leader_passed'" class="status-pill processing"><i></i>领导已通过</span>
    <span th:case="'approved'" class="status-pill success"><i></i>已获批</span>
    <span th:case="'rejected'" class="status-pill danger"><i></i>已驳回</span>
    <span th:case="*" class="status-pill" th:text="${value}"></span>
</span>
<span th:fragment="grade(amount)"><span class="level-pill small" th:if="${amount < 1000}">小额</span><span class="level-pill medium" th:if="${amount >= 1000 and amount < 5000}">中额</span><span class="level-pill large" th:if="${amount >= 5000}">大额</span></span>
<div th:fragment="alerts"><div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div><div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div></div>
<article th:fragment="metric(label, value, detail, symbol, currency)" class="metric" th:with="formatted=${currency ? #numbers.formatDecimal(value, 1, 'COMMA', 2, 'POINT') : value}">
    <div class="metric-top"><span th:text="${label}"></span><span class="metric-icon"><svg th:replace="~{fragments/layout :: icon(${symbol})}"></svg></span></div>
    <div class="metric-value"><span class="currency" th:if="${currency}">¥</span><span th:text="${currency ? #strings.substringBefore(formatted, '.') : formatted}"></span><span class="decimal" th:if="${currency}" th:text="${'.' + #strings.substringAfter(formatted, '.')}"></span></div>
    <div class="metric-foot" th:text="${detail}"></div>
</article>
</body>
</html>
