<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="clubs" class="panel club-panel" aria-labelledby="clubs-title"><div class="panel-heading"><h2 id="clubs-title">各社团申请金额</h2><span class="subtle-label">单位：元</span></div><div class="bar-chart" data-club-chart><p class="chart-empty">正在加载统计数据…</p></div><div class="panel-footer"><span>统计范围：全部活动申请</span><a class="text-button" th:href="@{/report}">查看完整报表 <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></a></div></section>
<section th:fragment="status" class="panel status-panel" aria-labelledby="status-title"><div class="panel-heading compact"><h2 id="status-title">审批状态概览</h2><svg th:replace="~{fragments/layout :: icon('check')}"></svg></div><div class="status-body" data-status-chart><div class="donut" role="img" aria-label="审批状态分布"><div><strong th:text="${totalCount}"></strong><span>全部申请</span></div></div><div class="legend"></div></div></section>
<section th:fragment="grades" class="panel grade-panel"><div class="panel-heading compact"><h2>申请金额分级</h2><span class="subtle-label">按单份申请金额划分</span></div><div class="grades"><div class="grade" th:each="key,st : ${ {'小额(&lt;1000)', '中额(1000-5000)', '大额(&gt;=5000)'} }"><span class="grade-label"><span class="tiny-dot" th:classappend="${'grade-dot-' + st.count}"></span><span th:text="${st.index == 0 ? '小额申请' : st.index == 1 ? '中额申请' : '大额申请'}"></span><small th:text="${st.index == 0 ? '＜1,000 元' : st.index == 1 ? '1,000–4,999.99 元' : '≥5,000 元'}"></small></span><div><strong th:text="${gradeCount[#vars.key] ?: 0}"></strong><span>份</span></div><span class="grade-amount" th:text="${'¥' + #numbers.formatDecimal(gradeAmount[#vars.key] ?: 0, 1, 'COMMA', 2, 'POINT')}"></span></div></div></section>
</body></html>
